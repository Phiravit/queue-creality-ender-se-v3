{% extends "base.html" %}
{% block title %}Sign in · 3D Print Queue{% endblock %}
{% block body %}
<section class="card" style="max-width:420px; margin: 24px auto 0" aria-labelledby="in-h">
  <h2 id="in-h">Sign in to the print queue</h2>
  <p class="muted" style="margin-top:0">For SIT students. This device remembers you afterwards.</p>
  <form method="post" action="{{ url_for('login') }}">
    <label for="l-sid">Student ID</label>
    <input type="text" id="l-sid" name="sid" value="{{ sid }}" required maxlength="20"
           inputmode="numeric" autocomplete="username" autocapitalize="none" spellcheck="false">
    <label for="l-name">Full name <span class="muted">(first time only)</span></label>
    <input type="text" id="l-name" name="name" value="{{ name }}" maxlength="60" autocomplete="name">
    <div style="margin-top:14px"><button class="primary block">Sign in</button></div>
  </form>
</section>
{% endblock %}
